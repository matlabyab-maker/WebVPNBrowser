name: WebVPNBrowser Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recreate Android project
        shell: bash
        run: |
          cat > /tmp/project.b64 << 'PROJECT_EOF'
          
          PROJECT_EOF
          base64 -d /tmp/project.b64 > /tmp/project.zip
          rm -rf /tmp/project
          mkdir -p /tmp/project
          unzip -q /tmp/project.zip -d /tmp/project

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        shell: bash
        run: |
          curl -L --fail -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle

      - name: Build debug APK
        working-directory: /tmp/project
        shell: bash
        run: |
          /tmp/gradle/gradle-8.11.1/bin/gradle :app:assembleDebug --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebVPNBrowser-debug-apk
          path: /tmp/project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build logs if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WebVPNBrowser-build-logs
          path: |
            /tmp/project/**/*.log
            /tmp/project/**/*.txt
          if-no-files-found: ignore
