          PROJECT_EOF
          base64 -d /tmp/project.b64 > /tmp/project.zip
          unzip -q /tmp/project.zip -d /tmp/project

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        shell: bash
        run: |
          curl -L --fail -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle

      - name: Build debug APK and save full log
        working-directory: /tmp/project
        shell: bash
        run: |
          set +e
          /tmp/gradle/gradle-8.11.1/bin/gradle :app:assembleDebug --stacktrace --info 2>&1 | tee /tmp/build-logs/gradle-build.log
          status=${PIPESTATUS[0]}
          echo "gradle_exit_code=$status" | tee /tmp/build-logs/exit-code.txt
          exit $status

      - name: Collect diagnostics and error summary
        if: always()
        shell: bash
        run: |
          java -version > /tmp/build-logs/java-version.txt 2>&1 || true
          /tmp/gradle/gradle-8.11.1/bin/gradle --version > /tmp/build-logs/gradle-version.txt 2>&1 || true
          {
            echo "===== ERROR SUMMARY ====="
            grep -nE '(^e:|FAILURE:|BUILD FAILED|Execution failed|Caused by:|error:|ERROR)' /tmp/build-logs/gradle-build.log || true
          } > /tmp/build-logs/build-error-summary.txt
          find /tmp/project -type f \( -name "*.log" -o -name "*.txt" \) -print0 | xargs -0 -r -I{} sh -c 'echo "===== {} ====="; cat "{}"' > /tmp/build-logs/project-diagnostics.log || true

      - name: Upload APK if produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WebVPNBrowser-debug-apk
          path: /tmp/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload complete build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WebVPNBrowser-complete-build-logs
          path: /tmp/build-logs
          retention-days: 14
